[package]
name = "roton-iced"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
directories = "5.0"
display-info = "0.5.7"
iced = { version = "0.13", features = ["image", "svg", "tokio"] }
notify-rust = "4.11"
rfd = { version = "0.15", features = ["xdg-portal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
